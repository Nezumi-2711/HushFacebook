# Publishes a release whenever main carries a version that has no tag yet.
#
# To cut one: python3 tools/release_text.py cut --version X.Y.Z --summary FILE, then bump --version
# X.Y.Z (gradle.properties and the README badge), run ./gradlew :patches:generatePatchesList, commit
# and push to main. A push that leaves the version alone does nothing past the first job.
#
# The bundle is built from the pushed commit, checked the way scripts/release/release.ps1 checks
# it, attested, and published with its SBOM, its tooling list and SHA256SUMS.txt.
# patches-bundle.json is then pointed at this repository's release in a commit of its own, so
# Morphe Manager picks the new bundle up. That commit is pushed with GITHUB_TOKEN, which never
# starts another workflow run. README.md and the bug form are left as upstream has them.
#
# No release receipt, and no tests: the receipt applies every patch to the declared Facebook APKs,
# and the runner has none.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, and never a half-finished one cancelled by the next push.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=gradle.properties::version '$version' isn't X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released, so there is nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no tag yet, so it will be released." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write     # the tag, the release and the index commit
      packages: read      # Morphe's Gradle plugin comes from GitHub Packages
      id-token: write     # signing the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUNDLE: patches-${{ needs.check.outputs.version }}.mpp
      SBOM: patches-${{ needs.check.outputs.version }}.cdx.json
      TOOLING: patches-${{ needs.check.outputs.version }}.tooling.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the release text
        run: |
          if ! grep -q "^## $VERSION (" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## $VERSION (date)' section. Run: python3 tools/release_text.py cut --version $VERSION --summary FILE"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check the translations
        run: python tools/release_text.py check-translations

      # buildAndroid is finalized by verifyBundle, which fails on a patches-list.json that names
      # another version or other patches than the bundle carries, and by the SBOM and the tooling
      # list. gradlew is run through bash: it isn't executable in git, and chmod would make the
      # tree dirty, which the build records in the bundle and the checks below refuse.
      - name: Build the bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e -o pipefail
          bash ./gradlew :patches:buildAndroid --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            # The failure as an annotation, so the run's summary page says why without the full log.
            python - "$RUNNER_TEMP/gradle.log" << 'EOF'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          start = next((i for i, l in enumerate(lines) if l.startswith("* What went wrong")), None)
          picked = lines[start:start + 40] if start is not None else []
          picked += ["", "... last lines ..."] + lines[-60:]
          text = "\n".join(picked)
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Gradle build failed::" + text)
          EOF
            exit "$status"
          fi

      - name: Check the bundle
        run: |
          built="patches/build/release"
          bundle="$built/$BUNDLE"
          test -f "$bundle" || { echo "::error::No bundle at $bundle"; exit 1; }
          for name in "$SBOM" "$TOOLING"; do
            test -f "$built/$name" || { echo "::error::No $name in $built"; exit 1; }
          done
          unzip -Z1 "$bundle" | grep -qx classes.dex \
            || { echo "::error::The bundle has no classes.dex, so Manager would load no patches"; exit 1; }
          manifest=$(unzip -p "$bundle" META-INF/MANIFEST.MF | tr -d '\r')
          stamp=$(sed -n 's/^Timestamp: *//p' <<< "$manifest")
          expected="$(git log -1 --format=%ct)000"
          [ "$stamp" = "$expected" ] \
            || { echo "::error::Timestamp $stamp isn't pinned to the commit ($expected)"; exit 1; }
          grep -qx 'Hushfacebook-Source-State: clean' <<< "$manifest" \
            || { echo "::error::The bundle wasn't built from a clean checkout"; exit 1; }
          grep -qx "Hushfacebook-Source-Commit: $GITHUB_SHA" <<< "$manifest" \
            || { echo "::error::The bundle names another source commit than $GITHUB_SHA"; exit 1; }
          [ "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$(tr -d '[:space:]' < "$built/bundle.sha256")" ] \
            || { echo "::error::The bundle changed after the build recorded its checksum"; exit 1; }
          mkdir -p dist
          cp "$bundle" "$built/$SBOM" "$built/$TOOLING" dist/
          (cd dist && sha256sum "$BUNDLE" "$SBOM" "$TOOLING" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.BUNDLE }}

      - name: Write the release notes
        run: |
          python .github/scripts/release_ci.py notes --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/$BUNDLE" "dist/$SBOM" "dist/$TOOLING" dist/SHA256SUMS.txt
          # Download what was published and hold it to the local checksums.
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -D "$RUNNER_TEMP/hosted"
          (cd "$RUNNER_TEMP/hosted" && sha256sum -c SHA256SUMS.txt)

      - name: Point Manager at the new bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          # Written from the released commit's CHANGELOG and patch list, then laid on the newest main.
          python .github/scripts/release_ci.py index --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" --created "$created" --commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/patches-bundle.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/patches-bundle.json" patches-bundle.json
          if git diff --quiet -- patches-bundle.json; then
            echo "patches-bundle.json already points at v$VERSION."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): point Manager to the v$VERSION bundle" -- patches-bundle.json
          git push origin main
          echo "Manager source: https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/patches-bundle.json" | tee -a "$GITHUB_STEP_SUMMARY"
